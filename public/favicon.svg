<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="#7C3AED"/>

  <!-- Castle body -->
  <rect x="22" y="52" width="56" height="32" rx="2" fill="#FFFFFF"/>

  <!-- Castle door -->
  <rect x="40" y="66" width="20" height="18" rx="3" fill="#7C3AED"/>

  <!-- Left tower -->
  <rect x="18" y="42" width="18" height="42" rx="2" fill="#FFFFFF"/>
  <!-- Left battlements -->
  <rect x="18" y="36" width="5" height="10" rx="1" fill="#FFFFFF"/>
  <rect x="26" y="36" width="5" height="10" rx="1" fill="#FFFFFF"/>

  <!-- Right tower -->
  <rect x="64" y="42" width="18" height="42" rx="2" fill="#FFFFFF"/>
  <!-- Right battlements -->
  <rect x="64" y="36" width="5" height="10" rx="1" fill="#FFFFFF"/>
  <rect x="72" y="36" width="5" height="10" rx="1" fill="#FFFFFF"/>

  <!-- Center battlements -->
  <rect x="34" y="46" width="5" height="10" rx="1" fill="#FFFFFF"/>
  <rect x="42" y="46" width="5" height="10" rx="1" fill="#FFFFFF"/>
  <rect x="50" y="46" width="5" height="10" rx="1" fill="#FFFFFF"/>
  <rect x="58" y="46" width="5" height="10" rx="1" fill="#FFFFFF"/>

  <!-- Flag -->
  <line x1="50" y1="12" x2="50" y2="38" stroke="#FFD700" stroke-width="2"/>
  <polygon points="50,12 62,19 50,26" fill="#FFD700"/>

  <!-- Windows left tower -->
  <rect x="22" y="50" width="10" height="8" rx="1" fill="#7C3AED"/>

  <!-- Windows right tower -->
  <rect x="68" y="50" width="10" height="8" rx="1" fill="#7C3AED"/>
</svg>
