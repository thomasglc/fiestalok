<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiestalo'k - Arrivée imminente !</title>
    <style>
        /* Import d'une police sympa */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;900&family=Poppins:wght@300;600&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background: #0f0c29;
            /* Dégradé animé en fond */
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #6a11cb);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            padding: 3rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            max-width: 600px;
            width: 90%;
            z-index: 1;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 4rem;
            margin: 0;
            background: linear-gradient(to right, #ff00cc, #3333ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: -2px;
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: 300;
            margin-top: 10px;
            opacity: 0.8;
            letter-spacing: 2px;
        }

        .status {
            margin: 40px 0;
        }

        .loader {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #ff00cc;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .highlight {
            color: #ff00cc;
            font-weight: 600;
        }

        /* Déco festive (petites bulles) */
        .bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            bottom: -100px;
            animation: rise 10s infinite ease-in;
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .container { padding: 2rem; }
        }
    </style>
</head>
<body>

    <div class="bubbles">
        <div class="bubble" style="left: 10%; width: 40px; height: 40px; animation-delay: 0s;"></div>
        <div class="bubble" style="left: 25%; width: 20px; height: 20px; animation-delay: 2s;"></div>
        <div class="bubble" style="left: 40%; width: 60px; height: 60px; animation-delay: 4s;"></div>
        <div class="bubble" style="left: 65%; width: 30px; height: 30px; animation-delay: 1s;"></div>
        <div class="bubble" style="left: 80%; width: 50px; height: 50px; animation-delay: 5s;"></div>
    </div>

    <div class="container">
        <h1>Fiestalo'k</h1>
        <div class="subtitle">LA FIESTA LOCA ARRIVE...</div>
        
        <div class="status">
            <div class="loader"></div>
        </div>

        <p>On prépare quelque chose de <span class="highlight">complètement givré</span> pour vos événements. Le site est actuellement en cours de montage, mais l'ambiance arrive très vite !</p>
        
        <p style="font-size: 0.9rem; opacity: 0.7;">Restez à l'écoute, ça va faire du bruit.</p>
    </div>

</body>
</html>
